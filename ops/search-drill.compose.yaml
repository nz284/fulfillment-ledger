# Used only by scripts/search_drill.py in its own disposable project.
services:
  api:
    ports: !override ["127.0.0.1::8080"]
  warehouse:
    ports: !override ["127.0.0.1::8080"]
  reconciler:
    ports: !override ["127.0.0.1::8080"]
  issue-search:
    ports: !override ["127.0.0.1::8080"]
    environment: {APP_SEARCH_PAGE_SIZE: "2", APP_SEARCH_BUILD_MS: "2000"}
