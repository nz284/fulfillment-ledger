apiVersion: 1
datasources:
  - {name: Prometheus, uid: prometheus, type: prometheus, url: "http://prometheus:9090", access: proxy, isDefault: true}
  - name: Loki
    uid: loki
    type: loki
    url: http://loki:3100
    access: proxy
    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: '"traceId":"([0-9a-f]+)"'
          datasourceUid: tempo
          url: '$${__value.raw}'
  - {name: Tempo, uid: tempo, type: tempo, url: "http://tempo:3200", access: proxy}
