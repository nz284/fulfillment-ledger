spring.application.name=${APP_NAME:fulfillment-api}
spring.profiles.default=api
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fulfillment}
spring.datasource.username=${DB_USER:fulfillment}
spring.datasource.password=${DB_PASSWORD:demo}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:9092}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
# Keep classic group failure detection below the dispatch recovery budget.
spring.kafka.consumer.properties[group.protocol]=classic
spring.kafka.consumer.properties[session.timeout.ms]=${KAFKA_SESSION_TIMEOUT_MS:9000}
spring.kafka.consumer.properties[heartbeat.interval.ms]=${KAFKA_HEARTBEAT_MS:2000}
spring.kafka.listener.type=batch
spring.kafka.listener.ack-mode=batch
spring.kafka.listener.observation-enabled=true
spring.kafka.template.observation-enabled=true
spring.kafka.producer.acks=all
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.timeout=200ms
spring.data.redis.connect-timeout=200ms
management.endpoints.web.exposure.include=health,prometheus
management.otlp.metrics.export.enabled=false
management.tracing.sampling.probability=${TRACE_SAMPLE:0.1}
management.opentelemetry.tracing.export.otlp.endpoint=${TRACE_ENDPOINT:http://localhost:4318/v1/traces}
logging.structured.format.console=logstash
management.endpoint.health.probes.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
app.warehouse-url=${WAREHOUSE_URL:http://localhost:8082}
