name: Verify fulfillment
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: mvn -B verify
      - run: docker compose --profile observe --profile fault config --quiet
      - run: docker compose up --build -d
      - run: python3 scripts/smoke.py
      - name: Verify per-warehouse circuit isolation and recovery
        run: CIRCUIT_REPORT=circuit-report.json python3 scripts/circuit_drill.py
      - uses: actions/upload-artifact@v4
        with: {name: circuit-report, path: circuit-report.json}
      - name: Stop smoke stack before the two-worker drill
        run: docker compose down
      - name: Kill the lease owner and verify takeover
        env:
          B_FAULT_P95_BUDGET_MS: 15000
        run: |
          for trial in 1 2; do
            TAKEOVER_REPORT="takeover-report-$trial.json" python3 scripts/takeover.py
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: takeover-report
          path: takeover-report-*.json
      - if: failure()
        run: docker compose logs --tail 80
      - if: always()
        run: docker compose down -v
