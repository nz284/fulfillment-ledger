name: Verify fulfillment
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: mvn -B verify
      - run: docker compose --profile observe --profile fault config --quiet
      - run: docker compose up --build -d
      - run: python3 scripts/smoke.py
      - name: Stop smoke stack before the two-worker drill
        run: docker compose down
      - name: Kill the lease owner and verify takeover
        run: TAKEOVER_REPORT=takeover-report.json python3 scripts/takeover.py
      - uses: actions/upload-artifact@v4
        with:
          name: takeover-report
          path: takeover-report.json
      - if: failure()
        run: docker compose logs --tail 80
      - if: always()
        run: docker compose down -v
